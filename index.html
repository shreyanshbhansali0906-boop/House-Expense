<style>:root{--paper:#f3ecdc;--paper2:#ebe2cc;--card:#fbf8ef;--ink:#2b2420;--soft:#6b6154;--maroon:#7a2530;--dark:#5c1b23;--gold:#a6813c;--sage:#4f6b4f;--sage2:#3e5240;--rust:#b5533c;--blue:#3d5a80;--rule:#d8cbab;--shadow:0 8px 24px rgba(68,43,28,.08)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,#eee4cf,var(--paper));color:var(--ink);font-family:Georgia,"Noto Serif Devanagari",serif;min-height:100vh}
.shell{width:min(980px,100%);margin:auto;padding:14px 14px 40px}
.topline{height:7px;border-top:3px double var(--gold);border-bottom:1px solid var(--gold);margin-bottom:10px}
.brand{text-align:center;padding:2px 0 12px}.brand h1{margin:4px 0 0;font-size:28px;color:var(--dark)}.eyebrow{font:10px ui-monospace,monospace;letter-spacing:3px;color:var(--maroon);text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:15px;margin:0 0 13px;box-shadow:var(--shadow)}
.card h2{font-size:17px;color:var(--dark);margin:0 0 11px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font:12px ui-monospace,monospace;color:var(--soft);font-weight:normal}
.btn{border:0;border-radius:8px;padding:11px 14px;background:var(--maroon);color:#fff7e9;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;line-height:1.2}
.btn.sec{background:var(--paper2);color:var(--ink)}.btn.ghost{background:transparent;border:1px solid var(--maroon);color:var(--maroon)}
.btn.green{background:var(--sage)}.btn.danger{background:var(--rust)}.btn.mini{padding:6px 9px;font-size:12px;border-radius:6px}
.btn.huge{width:100%;padding:20px;font-size:22px;border-radius:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1 1 140px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}
.field{margin:0 0 10px}.field label{display:block;font:11px ui-monospace,monospace;letter-spacing:.5px;color:var(--soft);margin:0 0 5px}
.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);font-size:16px;font-family:inherit}
.field input:focus,.field select:focus{outline:2px solid rgba(166,129,60,.3);border-color:var(--gold)}
input.amount-big{font-size:34px!important;font-weight:700;text-align:center;padding:12px!important}
.muted{color:var(--soft)}.small{font-size:12px}.err{color:var(--rust)}.okc{color:var(--sage)}.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
.stat{background:var(--paper2);border-radius:8px;padding:10px 12px}.stat span{display:block;font:10px ui-monospace,monospace;letter-spacing:.5px;color:var(--soft);text-transform:uppercase}.stat b{font-size:20px;display:block}.stat small{display:block;font-size:11px}
.cash{border-radius:12px;padding:18px;color:#f8f0df;background:linear-gradient(135deg,var(--sage2),var(--sage));box-shadow:var(--shadow);margin-bottom:13px}
.cash .lbl{font:11px ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase;opacity:.85}.cash .big{font-size:44px;font-weight:700;margin:4px 0}
.cash .sub{font-size:14px;opacity:.9}.cash.hi .lbl{font:16px Georgia,serif;letter-spacing:0;text-transform:none}
.banner{border-radius:10px;padding:11px 13px;margin:0 0 10px;font-weight:600;font-size:14px}.banner.red{background:#f8d7da;color:#842029}.banner.org{background:#ffe8cc;color:#7a4100}.banner.blue{background:#e1ebf5;color:#21405f}.banner.green{background:#e3f1e1;color:#2d5a27}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid #eadfc4;cursor:pointer}.list .it:first-child{border-top:0}
.it .ic{font-size:22px;width:30px;text-align:center}.it .tx{flex:1;min-width:0}.it .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .tx small{color:var(--soft);font-size:12px}
.it .am{font-weight:700;white-space:nowrap;text-align:right}.it.removed{opacity:.5}.it.removed b{text-decoration:line-through}
.chip{display:inline-block;font:11px ui-monospace,monospace;padding:2px 7px;border-radius:20px;background:var(--paper2);color:var(--soft);margin:1px 2px 1px 0;white-space:nowrap}
.chip.open{background:#eaf3e6;color:#2d5a27}.chip.ver{background:#e1ebf5;color:#21405f}.chip.lock{background:#eee;color:#555}.chip.rem{background:#f8d7da;color:#842029}.chip.due{background:#ffe8cc;color:#7a4100}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.cat{border:1px solid var(--rule);background:#fff;border-radius:10px;padding:9px 4px;text-align:center;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink)}
.cat .e{display:block;font-size:24px}.cat.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{flex:1 1 auto;border:1px solid var(--rule);background:#fff;border-radius:20px;padding:9px 12px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink)}.seg button.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips .c{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:7px 11px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink)}.chips .c.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.lang{display:flex;gap:4px}.lang button{border:1px solid var(--rule);background:#fff;border-radius:14px;padding:4px 9px;font-size:12px;cursor:pointer;font-family:inherit}.lang button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{padding:6px 4px;border-bottom:1px solid #eadfc4;text-align:right;white-space:nowrap}table.t th:first-child,table.t td:first-child{text-align:left}table.t th{font:11px ui-monospace,monospace;color:var(--soft)}
.tablewrap{overflow-x:auto}
.modal{position:fixed;inset:0;background:rgba(30,20,15,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 22px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:14px}}
.sheet h3{margin:0 0 12px;color:var(--dark);display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;z-index:80;font-size:14px;max-width:92vw;text-align:center}
.toast.err{background:var(--rust)}
.lightbox{position:fixed;inset:0;background:#000;z-index:90;overflow:auto;display:flex;align-items:center;justify-content:center}.lightbox img{max-width:100%;cursor:zoom-in}.lightbox img.z{max-width:none;width:250%;cursor:zoom-out}
.lightbox .x{position:fixed;top:12px;right:12px;z-index:91}
.preview{background:var(--blue);color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.footer{text-align:center;color:var(--soft);font:11px ui-monospace,monospace;margin-top:18px}
.bar{height:7px;background:#e9dfc8;border-radius:4px}.bar i{display:block;height:7px;background:var(--maroon);border-radius:4px}
.todo .it{cursor:default}.kbd{font:12px ui-monospace,monospace;background:var(--paper2);padding:2px 6px;border-radius:4px}
.hi-big{font-size:17px}.hi-big .it .tx b{font-size:17px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}.cash .big{font-size:40px}.brand h1{font-size:24px}}

input.date-big{font-size:22px!important;font-weight:700;text-align:center;padding:12px!important;margin-top:8px;width:100%;border:2px solid var(--ink,#333)!important;border-radius:10px}


.cats.need{outline:3px solid var(--rust);outline-offset:4px;border-radius:10px}
</style>
</head>

function addDays(s, n) { var d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); }

/* ---------- loan passbook: 1%/month (or set rates), compounded at each month end, pro-rata by days ---------- */
function loanEvents(txs) {
  var ev = [];
  (txs || []).forEach(function (x) {
    var a = Number(x.amount), d = x.transaction_date;
    if (x.type === 'fund_add' && (x.source || 'shreyansh') === 'shreyansh') ev.push({ d: d, k: 'given', a: a, x: x });
    else if (x.type === 'loan_adjust') ev.push({ d: d, k: 'adjusted', a: a, x: x });
    else if (x.type === 'fund_correction' && x.source === 'shreyansh') ev.push({ d: d, k: 'corr', a: (Number(x.balance_after) >= Number(x.balance_before) ? a : -a), x: x });
    else if (x.type === 'loan_repay') ev.push({ d: d, k: 'repaid', a: a, x: x });
  });

/* ---------- cost-centre picker (split) ---------- */
function ccPicker(box, init, getTotal) {
  var st = { sel: [], amt: {}, manual: false };
  (init && init.length ? init : [['Household', 0]]).forEach(function (x) { st.sel.push(x[0]); st.amt[x[0]] = Math.abs(Number(x[1]) || 0); });
  function eq(t2, n) { var b = Math.floor(t2 / n * 100) / 100, a = []; for (var i = 0; i < n; i++) a.push(b); a[n - 1] = Math.round((t2 - b * (n - 1)) * 100) / 100; return a; }
  if (st.sel.length > 1) { var tt = st.sel.reduce(function (a, k) { return a + st.amt[k]; }, 0), qq = eq(tt, st.sel.length); st.manual = st.sel.some(function (k, i) { return Math.abs(st.amt[k] - qq[i]) > 0.011; }); }
  function recalc() { if (st.sel.length > 1 && !st.manual) { var qq2 = eq(getTotal(), st.sel.length); st.sel.forEach(function (k, i) { st.amt[k] = qq2[i]; }); } }
  function draw() {
    recalc(); var L = ccList(), multi = st.sel.length > 1, T2 = getTotal(), sum = st.sel.reduce(function (a, k) { return a + (st.amt[k] || 0); }, 0), ok = Math.abs(sum - T2) <= 0.01;
    box.innerHTML = '<div class="chips">' + L.map(function (c) { return '<button type="button" class="c ' + (st.sel.indexOf(c) >= 0 ? 'on' : '') + '" data-c="' + esc(c) + '">' + (st.sel.indexOf(c) >= 0 ? '✓ ' : '') + esc(pName(c)) + '</button>'; }).join('') + '</div>' +
      (multi ? '<div style="margin-top:8px">' + st.sel.map(function (c) { return '<div class="row sp" style="margin:5px 0"><span>' + esc(pName(c)) + '</span><input type="number" step="0.01" min="0" data-amt="' + esc(c) + '" value="' + st.amt[c] + '" style="max-width:120px;padding:8px;border:1px solid var(--rule);border-radius:6px"></div>'; }).join('') + '<div class="row sp small"><b style="color:' + (ok ? '#2d5a27' : '#842029') + '">₹' + money(sum) + ' / ₹' + money(T2) + ' ' + (ok ? '✓' : '⚠️') + '</b><button type="button" class="btn sec mini" data-eq="1">= ' + (LANG === 'hi' ? 'बराबर बाँटो' : 'Split equally') + '</button></div></div>' : '');
    box.querySelectorAll('[data-c]').forEach(function (b) { b.onclick = function () { var c = b.dataset.c, i = st.sel.indexOf(c); if (i >= 0) { if (st.sel.length > 1) st.sel.splice(i, 1); } else if (st.sel.length === 1 && st.sel[0] === 'Household' && c !== 'Household') { st.sel = [c]; } else st.sel.push(c); st.manual = false; draw(); }; });
    box.querySelectorAll('[data-amt]').forEach(function (i) { i.onchange = function () { st.amt[i.dataset.amt] = Number(i.value) || 0; st.manual = true; draw(); }; });
    var e2 = box.querySelector('[data-eq]'); if (e2) e2.onclick = function () { st.manual = false; draw(); };
  }
  draw();
  return {
    refresh: draw, set: function (list) { st.sel = list.slice(); st.amt = {}; st.manual = false; draw(); },
    get: function () { recalc(); var T2 = getTotal(); if (st.sel.length === 1) return { ok: true, shares: [[st.sel[0], T2]] }; var sum = st.sel.reduce(function (a, k) { return a + st.amt[k]; }, 0); if (Math.abs(sum - T2) > 0.01) return { ok: false, err: 'Split ₹' + money(sum) + ' ≠ ₹' + money(T2) }; if (st.sel.some(function (k) { return !(st.amt[k] > 0); })) return { ok: false, err: 'Split: har hissa 0 se zyada' }; return { ok: true, shares: st.sel.map(function (k) { return [k, st.amt[k]]; }) }; }
  };
}

  signup: async function (el) {
    var nm = $('suName').value.trim(), em = $('auEmail').value.trim().toLowerCase(), pw = $('auPass').value;
    if (!nm || !em || pw.length < 6) { $('authMsg').textContent = 'Enter name, email and a password of 6+ characters · नाम, ईमेल और 6+ अक्षर का पासवर्ड डालें'; return; }
    busy(el, true); var r = await sb.auth.signUp({ email: em, password: pw, options: { data: { name: nm }, emailRedirectTo: location.origin } }); busy(el, false);
    if (r.error) { $('authMsg').textContent = r.error.message; return; }
    lsSet('gk14-email', em);
    if (r.data.session) await afterLogin(r.data.user); else { ST.authTab = 'login'; render(); $('authMsg').textContent = 'Account created. Confirm your email, then log in (or ask Shreyansh to reset). · खाता बन गया। ईमेल कन्फ़र्म करके लॉगिन करें।'; }
  },
  logout: async function () { if (chan) try { sb.removeChannel(chan); } catch (e) { } await sb.auth.signOut(); resetState(); render(); },
  refresh: async function () { await refresh(); toast('✓'); },
  join: async function () { var c = $('joinCode').value.trim(); if (!c) return; await rpc('join_household', { p_code: c }); await refresh(); },
  createHouse: async function () { await rpc('create_household', { p_name: $('houseName').value.trim() || 'Ghar' }); await refresh(); },
  lang: async function (el) { LANG = el.dataset.v; render(); if (!ST.viewAs) rpc('set_my_lang', { p_household: ST.hh.id, p_lang: LANG }).catch(function () { }); },
  viewAs: function (el) { ST.viewAs = el.dataset.v || null; LANG = ST.viewAs ? DEF_LANG[ST.viewAs] : (ST.status.lang || DEF_LANG[ST.role]); render(); window.scrollTo(0, 0); },
  more: function (el) { ST.more[el.dataset.k] = !ST.more[el.dataset.k]; render(); },
  addExp: function () { expenseForm(null); },
  detail: function (el) { detail(el.dataset.id); },
  editExp: function (el) { var e = ST.expenses.filter(function (x) { return x.id === el.dataset.id; })[0]; closeModal(); expenseForm(e); },
  correctExp: function (el) { closeModal(); correctModal(el.dataset.id); },
  removeExp: async function (el) { var why = prompt('Reason for removing (required):'); if (!why) return; await rpc('remove_expense', { p_id: el.dataset.id, p_reason: why }); closeModal(); toast('Removed'); await refresh(); },
  hist: function (el) { return showHistory(el.dataset.id); },
  photo: function (el) { return showPhoto(el.dataset.id); },
  verifyOne: async function (el) { await rpc('verify_expenses', { p_ids: [el.dataset.id] }); await refresh(); if ($('modal') && unverified().length) verifyModal(); else closeModal(); toast('✓'); },
  verifyAll: async function () { await rpc('verify_expenses', { p_ids: unverified().map(function (e) { return e.id; }) }); closeModal(); await refresh(); toast(t('allDone')); },
  verifyList: verifyModal, approveList: approveModal,
  approveOne: async function (el) { await rpc('approve_settlement', { p_id: el.dataset.id }); closeModal(); await refresh(); toast('✓'); },
  settle: function (el) { payModal(el.dataset.p); }, pay: function (el) { payModal(el.dataset.p); }, giveBack: function (el) { returnModal(el.dataset.p); },
  size: function (el) { lsSet('gk-size', el.dataset.v); applySize(); },
  cashCheck: cashCheckModal, topup: topupModal, repay: repayModal, fundFix: fundFixModal, report: supervisorReport, passbookRO: passbookRO,
  stPdf: statementPdf, stXls: statementXls, stWa: statementWa, xlsAll: xlsAll,
  jsonAll: function () { download('ghar-kharcha-' + today() + '.json', JSON.stringify({ app: 'ghar-kharcha-online', version: 14, exportedAt: new Date().toISOString(), household: ST.hh, wallet: ST.wallet, expenses: ST.expenses, transactions: ST.txs, settlements: ST.settlements, month_closes: ST.closes, cash_checks: ST.checks }, null, 1)); },
  settleStmt: function () { var d = prompt('Settlement statement as on date (YYYY-MM-DD):', today()); if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) passbookPdf(d, true); },
  passbookPdf: function () { passbookPdf(today(), false); },
  closeMonth: async function (el) { var m = el.dataset.m; if (!(await confirmBox('Close ' + monthName(m) + ' (and any earlier open months)? Entries can then only be corrected, never edited.', 'Close month'))) return; var n = await rpc('close_month', { p_household: ST.hh.id, p_month: m }); toast(n + ' month(s) closed'); await refresh(); try { var r = await sb.functions.invoke('monthly-statement', { body: {} }); if (!r.error) toast('📧 Statement email sent'); else console.warn('email', r.error); } catch (e) { console.warn('email', e); } },
  mreport: function (el) { monthReportModal(el.dataset.m); },
  emailNow: async function (el) { var r = await sb.functions.invoke('monthly-statement', { body: { month: el.dataset.m, force: true } }); if (r.error) throw r.error; toast('📧 Sent to ' + (ST.hh.report_email || '')); },
  backupNow: async function () { await rpc('backup_now', { p_household: ST.hh.id }); toast('💾 Backup done'); await refresh(); },
  dlBackup: async function (el) { var d = await q(sb.from('backups').select('*').eq('id', el.dataset.id).maybeSingle()); download('ghar-kharcha-backup-' + d.created_at.slice(0, 10) + '.json', JSON.stringify(d.data)); },
  sugSend: async function () { var v = $('sugTxt').value.trim(); if (!v) return; await rpc('add_suggestion', { p_household: ST.hh.id, p_text: v }); toast(t('saved')); await refresh(); },
  sugDel: async function (el) { await rpc('delete_suggestion', { p_id: el.dataset.id }); await refresh(); },
  approveMember: async function (el) { await rpc('set_member_role', { p_household: ST.hh.id, p_user: el.dataset.u, p_role: el.dataset.r }); toast('Approved'); await refresh(); },
  setRole: async function (el) { if (el.dataset.r === 'remove' && !(await confirmBox('Remove this person?', 'Remove'))) return; await rpc('set_member_role', { p_household: ST.hh.id, p_user: el.dataset.u, p_role: el.dataset.r }); await refresh(); },
  resetPw: async function (el) { var pw = prompt(hiText('New password for ' + el.dataset.n + ' (min 6 characters):'), 'Ghar@' + Math.floor(1000 + Math.random() * 9000)); if (!pw) return; await rpc('admin_set_password', { p_household: ST.hh.id, p_user: el.dataset.u, p_password: pw }); openModal(sheetHead('🔑 Password changed') + '<p>Send this to ' + esc(el.dataset.n) + ':</p><p class="kbd" style="font-size:20px">' + esc(pw) + '</p><a class="btn" target="_blank" href="https://wa.me/?text=' + encodeURIComponent(t('newPwMsg', { p: pw, u: location.origin })) + '">📤 WhatsApp</a>'); },
  regen: async function () { if (!(await confirmBox('Make new family and guest codes? Old codes stop working.', 'Yes'))) return; var r = await rpc('regen_codes', { p_household: ST.hh.id }); toast('New codes: ' + r.join_code + ' / ' + r.guest_code); await refresh(); },
  saveSettings: async function () { await rpc('update_household', { p_household: ST.hh.id, p_name: $('setName').value.trim(), p_report_email: $('setEmail').value.trim() }); toast('Saved'); await refresh(); },
  addRate: async function () { var f = $('rateFrom').value, v = Number($('rateVal').value); if (!f || !(v >= 0)) return; var rates = (ST.hh.loan_rates || []).filter(function (r) { return r.from !== f; }).concat([{ from: f, rate: v }]); await rpc('update_household', { p_household: ST.hh.id, p_loan_rates: rates }); toast('Rate saved'); await refresh(); },
  saveAlert: async function () { var v = $('alThr').value.trim(); var r = await rpc('set_fund_alert', { p_household: ST.hh.id, p_threshold: v === '' ? null : Number(v), p_phone: $('alPhone').value.trim() || null, p_apikey: $('alKey').value.trim() || null }); toast(r.sent_now ? 'Saved — fund is already below the limit, alert sent' : 'Alert saved'); await refresh(); },
  testAlert: async function () { var r = await rpc('test_fund_alert', { p_household: ST.hh.id }); toast('Test sent: ' + (r || 'nothing configured')); },
  ccEdit: async function () { var v = prompt('Cost centres (comma separated):', ccList().join(', ')); if (v === null) return; var list = uniq(v.split(',').map(function (x) { return x.trim(); })); if (list.indexOf('Household') < 0) list.unshift('Household'); await rpc('set_cost_centres', { p_household: ST.hh.id, p_list: list }); await refresh(); }
};
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]'); if (!el || el.tagName === 'SELECT') return;
  var f = A[el.dataset.a]; if (!f) return; ev.preventDefault(); guard(f)(el);
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.dataset.f) { ST.f[el.dataset.f] = el.value; render(); return; }
  var a = el.dataset.a;
  if (a === 'stM') { ST.stM = el.value; render(); } else if (a === 'stC') { ST.stC = el.value; render(); } else if (a === 'chP') { ST.chP = el.value; render(); }
  else if (a === 'viewAsSel') { A.viewAs({ dataset: { v: el.value } }); }
  else if (a === 'roleSel') { guard(A.setRole)({ dataset: { u: el.dataset.u, r: el.value } }); }
});
document.addEventListener('input', function (ev) { var el = ev.target; if (el.dataset.f === 'q') { ST.f.q = el.value; clearTimeout(ST._qt); ST._qt = setTimeout(function () { render(); var i = document.querySelector('[data-f="q"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 350); } });
document.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && ev.target && (ev.target.id === 'auPass')) { var b = document.querySelector('[data-a="login"],[data-a="signup"]'); if (b) b.click(); } });
window.addEventListener('error', function (e) { toast('Error: ' + (e.message || ''), true); });
window.addEventListener('unhandledrejection', function (e) { showErr(e.reason); });
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () { });
document.addEventListener('DOMContentLoaded', boot);
</script>
